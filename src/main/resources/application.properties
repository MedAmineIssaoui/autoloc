# Application
spring.application.name=autoloc-api

# Connexion BD (H2 en mémoire pour démarrer sans MySQL local)
spring.datasource.url=jdbc:h2:mem:autoloc_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

# Server
server.port=8081

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
